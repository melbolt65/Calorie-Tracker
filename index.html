<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calorie Calculator</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --surface-bg: #252525;
      --input-bg: #2a2a2a;
      --border-color: #333333;
      --divider-color: #2c2c2c;
      --text-primary: #f0f0f0;
      --text-secondary: #aaaaaa;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-text: #ffffff;
      --danger: #ef4444;
      --btn-secondary-bg: #333333;
      --btn-secondary-text: #dddddd;
      --shadow: none;
    }

    body.light-mode {
      --bg-color: #f3f4f6;
      --card-bg: #ffffff;
      --surface-bg: #f8fafc;
      --input-bg: #ffffff;
      --border-color: #d1d5db;
      --divider-color: #e5e7eb;
      --text-primary: #111827;
      --text-secondary: #6b7280;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --accent-text: #ffffff;
      --danger: #dc2626;
      --btn-secondary-bg: #e5e7eb;
      --btn-secondary-text: #374151;
      --shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
      transition: background-color 0.2s, color 0.2s;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 700;
      margin: 0;
    }

    .theme-toggle {
      width: auto;
      padding: 6px 12px;
      font-size: 0.85rem;
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--text-primary);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow);
      cursor: pointer;
    }

    h2 { margin-top: 0; font-size: 1.2rem; margin-bottom: 12px; }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--divider-color);
    }

    .mode-switch {
      display: flex;
      background: var(--surface-bg);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 14px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-secondary);
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
    }

    .mode-btn.active {
      background: var(--accent);
      color: var(--accent-text);
    }

    label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-secondary);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .result-box {
      text-align: center;
      padding: 12px;
      background: var(--surface-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .result-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent);
    }

    button.action-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-add {
      background: var(--accent);
      color: var(--accent-text);
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .btn-clear {
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      margin-top: 14px;
      padding: 10px;
      font-size: 0.9rem;
    }

    .tally-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .target-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .target-row label {
      margin: 0;
      white-space: nowrap;
    }

    .target-row input {
      margin: 0;
      width: 130px;
      padding: 7px 10px;
      text-align: right;
      font-size: 0.95rem;
    }

    .progress-container {
      background: var(--surface-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--divider-color);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 6px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--accent);
      transition: width 0.25s ease, background-color 0.25s ease;
    }

    .progress-fill.over {
      background: var(--danger);
    }

    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-secondary);
    }

    .over-text {
      color: var(--danger);
      font-weight: 600;
    }

    .meal-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--divider-color);
    }

    .meal-header {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 6px;
      color: var(--accent);
    }

    ul { list-style: none; padding: 0; margin: 0; }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-bottom: 1px solid var(--divider-color);
      font-size: 0.92rem;
    }

    li:last-child { border-bottom: none; }

    .empty-meal {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-style: italic;
      padding: 2px 0 4px 0;
    }

    .delete-item {
      color: var(--danger);
      cursor: pointer;
      margin-left: 10px;
      font-weight: bold;
      padding: 2px 6px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1 class="app-title">Calorie Tracker</h1>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">☀️ Light Mode</button>
  </div>

  <div class="card">
    <div class="mode-switch">
      <button class="mode-btn active" id="btnWeighMode" onclick="setMode('weigh')">Weigh Food</button>
      <button class="mode-btn" id="btnDirectMode" onclick="setMode('direct')">Direct Calories</button>
    </div>

    <div id="weighInputs">
      <label for="servingGrams">Grams per serving (label)</label>
      <input type="number" id="servingGrams" inputmode="decimal" placeholder="e.g. 112" oninput="calculate()">

      <label for="servingCals">Calories per serving (label)</label>
      <input type="number" id="servingCals" inputmode="decimal" placeholder="e.g. 160" oninput="calculate()">

      <label for="foodGrams">Your food weight (grams)</label>
      <input type="number" id="foodGrams" inputmode="decimal" placeholder="e.g. 168" oninput="calculate()">

      <div class="result-box">
        <div style="font-size: 0.85rem; color: var(--text-secondary);">Calculated Calories</div>
        <div class="result-number" id="result">0</div>
      </div>
    </div>

    <div id="directInputs" class="hidden">
      <label for="directCals">Calories</label>
      <input type="number" id="directCals" inputmode="decimal" placeholder="e.g. 250">
    </div>

    <label for="mealCategory">Meal Category</label>
    <select id="mealCategory">
      <option value="Breakfast">Breakfast</option>
      <option value="Lunch">Lunch</option>
      <option value="Dinner">Dinner</option>
      <option value="Snack">Snack</option>
    </select>

    <input type="text" id="foodName" placeholder="Optional food label (e.g. Chicken)">
    <button class="action-btn btn-add" onclick="addToTally()">+ Add to Daily Tally</button>
  </div>

  <div class="card">
    <div class="tally-header">
      <span>Daily Total:</span>
      <span style="color: var(--accent);"><span id="totalCals">0</span> kcal</span>
    </div>

    <div class="target-row">
      <label for="dailyTarget">Daily Goal (kcal):</label>
      <input type="number" id="dailyTarget" inputmode="numeric" placeholder="e.g. 2000" oninput="saveTarget()">
    </div>

    <div class="progress-container hidden" id="progressBox">
      <div class="progress-track">
        <div class="progress-fill" id="progressBar"></div>
      </div>
      <div class="progress-stats">
        <span id="percentText">0% of goal</span>
        <span id="remainingText">0 kcal left</span>
      </div>
    </div>

    <div id="mealSections"></div>

    <button class="action-btn btn-clear" onclick="clearTally()">Reset Daily Tally</button>
  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('calLogs')) || [];
    let currentMode = 'weigh';

    function initTheme() {
      const savedTheme = localStorage.getItem('calTheme') || 'dark';
      if (savedTheme === 'light') {
        document.body.classList.add('light-mode');
        document.getElementById('themeBtn').innerText = '🌙 Dark Mode';
      } else {
        document.body.classList.remove('light-mode');
        document.getElementById('themeBtn').innerText = '☀️ Light Mode';
      }
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-mode');
      localStorage.setItem('calTheme', isLight ? 'light' : 'dark');
      document.getElementById('themeBtn').innerText = isLight ? '🌙 Dark Mode' : '☀️ Light Mode';
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnWeighMode').classList.toggle('active', mode === 'weigh');
      document.getElementById('btnDirectMode').classList.toggle('active', mode === 'direct');
      document.getElementById('weighInputs').classList.toggle('hidden', mode !== 'weigh');
      document.getElementById('directInputs').classList.toggle('hidden', mode !== 'direct');
    }

    function calculate() {
      const sg = parseFloat(document.getElementById('servingGrams').value);
      const sc = parseFloat(document.getElementById('servingCals').value);
      const fg = parseFloat(document.getElementById('foodGrams').value);

      if (sg > 0 && sc >= 0 && fg >= 0) {
        const cals = Math.round((sc / sg) * fg);
        document.getElementById('result').innerText = cals;
        return cals;
      } else {
        document.getElementById('result').innerText = '0';
        return 0;
      }
    }

    function addToTally() {
      let cals = 0;
      let label = '';
      const nameInput = document.getElementById('foodName').value.trim();
      const meal = document.getElementById('mealCategory').value;

      if (currentMode === 'weigh') {
        cals = calculate();
        if (cals <= 0) return;
        const fg = document.getElementById('foodGrams').value;
        label = nameInput ? `${nameInput} (${fg}g)` : `Food (${fg}g)`;
        document.getElementById('foodGrams').value = '';
        document.getElementById('result').innerText = '0';
      } else {
        cals = Math.round(parseFloat(document.getElementById('directCals').value));
        if (!(cals > 0)) return;
        label = nameInput ? nameInput : 'Quick Entry';
        document.getElementById('directCals').value = '';
      }

      logs.push({ label, cals, meal });
      document.getElementById('foodName').value = '';
      saveAndRender();
    }

    function removeItem(index) {
      logs.splice(index, 1);
      saveAndRender();
    }

    function clearTally() {
      if (logs.length === 0) return;
      if (confirm('Are you sure you want to reset your daily tally?')) {
        logs = [];
        saveAndRender();
      }
    }

    function saveTarget() {
      const val = document.getElementById('dailyTarget').value;
      localStorage.setItem('calTarget', val);
      updateProgress();
    }

    function updateProgress() {
      const total = logs.reduce((sum, item) => sum + item.cals, 0);
      const target = parseFloat(document.getElementById('dailyTarget').value);
      const box = document.getElementById('progressBox');

      if (target > 0) {
        box.classList.remove('hidden');
        const pct = Math.round((total / target) * 100);
        const bar = document.getElementById('progressBar');
        bar.style.width = Math.min(pct, 100) + '%';

        const diff = target - total;
        const remEl = document.getElementById('remainingText');

        if (diff >= 0) {
          bar.classList.remove('over');
          remEl.classList.remove('over-text');
          remEl.innerText = `${diff} kcal left`;
        } else {
          bar.classList.add('over');
          remEl.classList.add('over-text');
          remEl.innerText = `${Math.abs(diff)} kcal over`;
        }
        document.getElementById('percentText').innerText = `${pct}% of goal`;
      } else {
        box.classList.add('hidden');
      }
    }

    function saveAndRender() {
      localStorage.setItem('calLogs', JSON.stringify(logs));
      const container = document.getElementById('mealSections');
      container.innerHTML = '';
      let total = 0;

      const categories = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];

      categories.forEach(cat => {
        const catItems = logs
          .map((item, idx) => ({ ...item, originalIndex: idx, meal: item.meal || 'Snack' }))
          .filter(item => item.meal === cat);

        const catTotal = catItems.reduce((sum, item) => sum + item.cals, 0);
        total += catTotal;

        const section = document.createElement('div');
        section.className = 'meal-section';

        let itemsHtml = '';
        if (catItems.length === 0) {
          itemsHtml = `<div class="empty-meal">No items logged</div>`;
        } else {
          itemsHtml = '<ul>' + catItems.map(item => `
            <li>
              <span>${item.label}</span>
              <span><strong>${item.cals}</strong> kcal <span class="delete-item" onclick="removeItem(${item.originalIndex})">×</span></span>
            </li>
          `).join('') + '</ul>';
        }

        section.innerHTML = `
          <div class="meal-header">
            <span>${cat}</span>
            <span>${catTotal} kcal</span>
          </div>
          ${itemsHtml}
        `;
        container.appendChild(section);
      });

      document.getElementById('totalCals').innerText = total;
      updateProgress();
    }

    initTheme();
    const savedTarget = localStorage.getItem('calTarget');
    if (savedTarget) {
      document.getElementById('dailyTarget').value = savedTarget;
    }
    saveAndRender();
  </script>
</body>
</html>
