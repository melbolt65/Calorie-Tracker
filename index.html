<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panem Ration Tracker</title>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js" defer></script>
  <style>
    :root {
      --bg-color: #111210;
      --card-bg: #1b1d19;
      --border-color: #363930;
      --text-main: #eae6d9;
      --text-muted: #9e9a8d;
      --input-bg: #252822;
      --input-border: #42463b;
      --box-bg: #151713;
      --accent: #d4af37;
      --accent-hover: #e5c158;
      --accent-text: #111210;
      --ember: #e25822;
      --danger: #d9381e;
      --btn-sec-bg: #2b2e27;
      --btn-sec-text: #d6d2c4;
      --shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    body.capitol-light {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --border-color: #dcd5c7;
      --text-main: #22201d;
      --text-muted: #6c675e;
      --input-bg: #faf8f5;
      --input-border: #cfc7b8;
      --box-bg: #f0ece3;
      --accent: #b5891d;
      --accent-hover: #9e7514;
      --accent-text: #ffffff;
      --ember: #c84614;
      --danger: #b82914;
      --btn-sec-bg: #e6e0d4;
      --btn-sec-text: #2c2924;
      --shadow: 0 3px 12px rgba(34, 32, 29, 0.08);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      max-width: 440px;
      margin: 0 auto;
      padding: 18px;
      transition: background-color 0.25s, color 0.25s;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .brand-title {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 1.25rem;
      font-weight: bold;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .theme-btn {
      width: auto;
      padding: 6px 12px;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      margin-bottom: 16px;
      box-shadow: var(--shadow);
      transition: background-color 0.25s, border-color 0.25s;
    }

    h2 {
      font-family: Georgia, "Times New Roman", serif;
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 1.15rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent);
    }

    label {
      display: block;
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
    }

    .mode-btn {
      flex: 1;
      padding: 10px;
      background: var(--btn-sec-bg);
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .mode-btn.active {
      background: var(--accent);
      color: var(--accent-text);
      border-color: var(--accent);
    }

    .panel-box {
      background: var(--box-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 14px;
    }

    .preset-row {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .preset-row select {
      margin-bottom: 0;
      flex: 1;
      font-size: 0.92rem;
      padding: 9px;
    }

    .btn-icon {
      width: auto;
      padding: 9px 11px;
      background: var(--btn-sec-bg);
      color: var(--danger);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-save-preset {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      background: transparent;
      color: var(--accent);
      border: 1px dashed var(--accent);
      border-radius: 6px;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-scan {
      width: 100%;
      padding: 11px;
      background: var(--btn-sec-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-scan.scanning {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    #reader {
      width: 100%;
      margin-top: 10px;
      border-radius: 6px;
      overflow: hidden;
      display: none;
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: center;
      min-height: 16px;
    }

    .api-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      width: 100%;
      text-align: center;
      font-size: 0.75rem;
      color: var(--text-muted);
      text-decoration: underline;
      cursor: pointer;
      margin-top: 6px;
      background: none;
      border: none;
      padding: 2px;
    }

    .api-drawer {
      display: none;
      margin-top: 8px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .api-row {
      display: flex;
      gap: 6px;
    }

    .api-row input {
      margin-bottom: 0;
      font-size: 0.85rem;
      padding: 8px;
    }

    .api-row button {
      width: auto;
      padding: 8px 12px;
      font-size: 0.8rem;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .result-box {
      text-align: center;
      padding: 12px;
      background: var(--box-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .result-number {
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent);
    }

    .btn-add {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add:hover {
      background: var(--accent-hover);
    }

    .btn-clear {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      margin-top: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
    }

    .btn-clear:hover {
      border-color: var(--danger);
      color: var(--danger);
    }

    .goal-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .goal-row label {
      margin-bottom: 0;
      white-space: nowrap;
    }

    .goal-row input {
      width: 115px;
      margin-bottom: 0;
      padding: 8px;
      text-align: right;
      font-weight: bold;
    }

    .progress-track {
      width: 100%;
      height: 12px;
      background: var(--box-bg);
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--ember));
      transition: width 0.3s ease;
    }

    .progress-fill.over {
      background: var(--danger);
    }

    .goal-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 12px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    .tally-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .meal-section {
      margin-top: 12px;
      padding-top: 8px;
      border-top: 1px solid var(--border-color);
    }

    .meal-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--accent);
      margin-bottom: 6px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      font-size: 0.92rem;
      border-bottom: 1px dashed var(--border-color);
    }

    li:last-child {
      border-bottom: none;
    }

    .delete-item {
      color: var(--danger);
      cursor: pointer;
      margin-left: 10px;
      font-weight: bold;
      display: inline-flex;
      align-items: center;
      vertical-align: middle;
    }

    .empty-msg {
      font-size: 0.82rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 2px 0;
    }

    .hidden {
      display: none !important;
    }

    svg.icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    svg.icon-lg {
      width: 18px;
      height: 18px;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div class="brand-title">
      <svg class="icon icon-lg" viewBox="0 0 24 24">
        <path d="M12 2c.5 3.5-1.5 5.5-1.5 8.5 0 2 1.5 3.5 3.5 3.5 1.5 0 2.5-1 2.5-2.5 0-1-.5-2-1-2.5 2 1 3.5 3 3.5 5.5 0 4-3.5 7.5-7.5 7.5S4 18.5 4 14.5c0-3.5 2.5-6.5 5.5-8-.5 1.5-.5 3 .5 4-.5-2.5.5-5.5 2-8.5z"/>
      </svg>
      <span>Panem Rations</span>
    </div>
    <button class="theme-btn" id="themeToggle" onclick="toggleTheme()"></button>
  </div>

  <div class="card">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnWeigh" onclick="setMode('weigh')">
        <svg class="icon" viewBox="0 0 24 24">
          <path d="M16 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/>
          <path d="M2 16l3-8 3 8c-.87.65-1.92 1-3 1s-2.13-.35-3-1z"/>
          <path d="M7 21h10"/>
          <path d="M12 3v18"/>
          <path d="M3 7h2c2 0 5-1 7-2 2 1 5 2 7 2h2"/>
        </svg>
        <span>Weigh Rations</span>
      </button>
      <button class="mode-btn" id="btnDirect" onclick="setMode('direct')">
        <svg class="icon" viewBox="0 0 24 24">
          <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>
        </svg>
        <span>Direct Supply</span>
      </button>
    </div>

    <div id="weighSection">
      <div class="panel-box">
        <label for="presetSelect">Saved Custom Presets (Offline)</label>
        <div class="preset-row">
          <select id="presetSelect" onchange="applyPreset()">
            <option value="">-- Select Saved Ration --</option>
          </select>
          <button class="btn-icon" onclick="deletePreset()" title="Delete selected preset" aria-label="Delete selected preset">
            <svg class="icon" viewBox="0 0 24 24">
              <polyline points="3 6 5 6 21 6"/>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
            </svg>
          </button>
        </div>
        <button class="btn-save-preset" onclick="savePreset()">
          <svg class="icon" viewBox="0 0 24 24">
            <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/>
          </svg>
          <span>Save Current Food as Preset</span>
        </button>
      </div>

      <div class="panel-box">
        <button class="btn-scan" id="scanToggleBtn" onclick="toggleScanner()"></button>
        <div id="reader"></div>
        <div class="status-text" id="scanStatus">USDA FoodData Central Verified Lookup</div>
        <button class="api-toggle" onclick="toggleApiDrawer()">
          <svg class="icon" style="width:12px;height:12px;" viewBox="0 0 24 24">
            <path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/>
          </svg>
          <span>Configure USDA API Key</span>
        </button>
        <div class="api-drawer" id="apiDrawer">
          <label for="usdaKeyInput">Personal USDA API Key (Saved Locally)</label>
          <div class="api-row">
            <input type="password" id="usdaKeyInput" placeholder="Paste key (default: DEMO_KEY)">
            <button onclick="saveApiKey()">
              <svg class="icon" viewBox="0 0 24 24">
                <polyline points="20 6 9 17 4 12"/>
              </svg>
              <span>Save</span>
            </button>
          </div>
        </div>
      </div>

      <label for="servingGrams">Grams per serving (label)</label>
      <input type="number" id="servingGrams" inputmode="decimal" placeholder="e.g. 112" oninput="calculate()">

      <label for="servingCals">Calories per serving (label)</label>
      <input type="number" id="servingCals" inputmode="decimal" placeholder="e.g. 160" oninput="calculate()">

      <label for="foodGrams">Your ration weight (grams)</label>
      <input type="number" id="foodGrams" inputmode="decimal" placeholder="e.g. 168" oninput="calculate()">

      <div class="result-box">
        <div style="font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.5px; color: var(--text-muted);">Calculated Energy</div>
        <div class="result-number" id="result">0</div>
      </div>
    </div>

    <div id="directSection" class="hidden">
      <label for="directCals">Direct Calories</label>
      <input type="number" id="directCals" inputmode="decimal" placeholder="e.g. 250">
    </div>

    <label for="mealCategory">Ration Period</label>
    <select id="mealCategory">
      <option value="Breakfast">Dawn Ration (Breakfast)</option>
      <option value="Lunch">Midday Ration (Lunch)</option>
      <option value="Dinner">Nightfall Ration (Dinner)</option>
      <option value="Snack">Sponsor Parachute (Snack)</option>
    </select>

    <label for="foodName">Ration Description (Optional)</label>
    <input type="text" id="foodName" placeholder="e.g. District 12 Oats, Groosling">

    <button class="btn-add" onclick="addToTally()">
      <svg class="icon icon-lg" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="10"/>
        <line x1="12" y1="8" x2="12" y2="16"/>
        <line x1="8" y1="12" x2="16" y2="12"/>
      </svg>
      <span>Log Ration</span>
    </button>
  </div>

  <div class="card">
    <h2>Tribute Ledger</h2>
    <div class="goal-row">
      <label for="dailyGoal">Daily Allotment (kcal)</label>
      <input type="number" id="dailyGoal" inputmode="numeric" placeholder="e.g. 2000" oninput="saveGoal()">
    </div>

    <div id="goalProgressArea" class="hidden">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="goal-stats">
        <span id="goalPercent">0% of allotment</span>
        <span id="goalRemaining">0 kcal remaining</span>
      </div>
    </div>

    <div class="tally-header">
      <span>Total Consumed:</span>
      <span style="color: var(--accent);"><span id="totalCals">0</span> kcal</span>
    </div>

    <div id="mealContainer"></div>

    <button class="btn-clear" onclick="clearTally()">
      <svg class="icon" viewBox="0 0 24 24">
        <polyline points="1 4 1 10 7 10"/>
        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
      </svg>
      <span>Cannon Reset (Clear Day)</span>
    </button>
  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('calLogs')) || [];
    let dailyGoal = parseFloat(localStorage.getItem('calGoal')) || 0;
    let currentMode = 'weigh';
    let isCapitolLight = localStorage.getItem('panemTheme') === 'light';
    let usdaApiKey = localStorage.getItem('usdaApiKey') || 'DEMO_KEY';
    let customPresets = JSON.parse(localStorage.getItem('calPresets')) || [];
    let html5QrCode = null;
    let isScanning = false;

    const BARCODE_SVG = `
      <svg class="icon icon-lg" viewBox="0 0 24 24">
        <path d="M3 7V5a2 2 0 0 1 2-2h2"/>
        <path d="M17 3h2a2 2 0 0 1 2 2v2"/>
        <path d="M21 17v2a2 2 0 0 1-2 2h-2"/>
        <path d="M7 21H5a2 2 0 0 1-2-2v-2"/>
        <line x1="7" y1="7" x2="7" y2="17"/>
        <line x1="10" y1="7" x2="10" y2="17" stroke-width="1.5"/>
        <line x1="14" y1="7" x2="14" y2="17" stroke-width="2.5"/>
        <line x1="17" y1="7" x2="17" y2="17"/>
      </svg>`;

    const STOP_SVG = `
      <svg class="icon icon-lg" viewBox="0 0 24 24">
        <rect x="6" y="6" width="12" height="12" rx="2"/>
      </svg>`;

    const SUN_SVG = `
      <svg class="icon" viewBox="0 0 24 24">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>`;

    const MOON_SVG = `
      <svg class="icon" viewBox="0 0 24 24">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>`;

    const MEALS = [
      { key: 'Breakfast', label: 'Dawn Ration (Breakfast)' },
      { key: 'Lunch', label: 'Midday Ration (Lunch)' },
      { key: 'Dinner', label: 'Nightfall Ration (Dinner)' },
      { key: 'Snack', label: 'Sponsor Parachute (Snack)' }
    ];

    function setScanButtonIdle() {
      const btn = document.getElementById('scanToggleBtn');
      btn.classList.remove('scanning');
      btn.innerHTML = `${BARCODE_SVG}<span>Scan Supply Barcode</span>`;
    }

    function setScanButtonActive() {
      const btn = document.getElementById('scanToggleBtn');
      btn.classList.add('scanning');
      btn.innerHTML = `${STOP_SVG}<span>Stop Scanner</span>`;
    }

    function applyTheme() {
      const btn = document.getElementById('themeToggle');
      if (isCapitolLight) {
        document.body.classList.add('capitol-light');
        btn.innerHTML = `${MOON_SVG}<span>Arena Dark</span>`;
      } else {
        document.body.classList.remove('capitol-light');
        btn.innerHTML = `${SUN_SVG}<span>Capitol Light</span>`;
      }
    }

    function toggleTheme() {
      isCapitolLight = !isCapitolLight;
      localStorage.setItem('panemTheme', isCapitolLight ? 'light' : 'dark');
      applyTheme();
    }

    function renderPresets() {
      const select = document.getElementById('presetSelect');
      select.innerHTML = '<option value="">-- Select Saved Ration --</option>';
      customPresets.sort((a, b) => a.name.localeCompare(b.name));
      customPresets.forEach((p, idx) => {
        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${p.name} (${p.servingCals} kcal / ${p.servingGrams}g)`;
        select.appendChild(opt);
      });
    }

    function savePreset() {
      const sg = parseFloat(document.getElementById('servingGrams').value);
      const sc = parseFloat(document.getElementById('servingCals').value);
      let name = document.getElementById('foodName').value.trim();

      if (!(sg > 0 && sc >= 0)) {
        alert('Enter valid serving grams and calories before saving a preset.');
        return;
      }

      if (!name) {
        name = prompt('Enter a name for this saved ration:');
        if (!name || !name.trim()) return;
        name = name.trim();
        document.getElementById('foodName').value = name;
      }

      const existingIdx = customPresets.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
      if (existingIdx >= 0) {
        customPresets[existingIdx] = { name, servingGrams: sg, servingCals: sc };
      } else {
        customPresets.push({ name, servingGrams: sg, servingCals: sc });
      }

      localStorage.setItem('calPresets', JSON.stringify(customPresets));
      renderPresets();
      const newIdx = customPresets.findIndex(p => p.name.toLowerCase() === name.toLowerCase());
      document.getElementById('presetSelect').value = newIdx;
      document.getElementById('scanStatus').innerText = `Saved "${name}" to offline presets.`;
    }

    function applyPreset() {
      const idx = document.getElementById('presetSelect').value;
      if (idx === '') return;
      const p = customPresets[parseInt(idx, 10)];
      if (!p) return;

      document.getElementById('servingGrams').value = p.servingGrams;
      document.getElementById('servingCals').value = p.servingCals;
      document.getElementById('foodName').value = p.name;
      calculate();
      document.getElementById('foodGrams').focus();
    }

    function deletePreset() {
      const idx = document.getElementById('presetSelect').value;
      if (idx === '') {
        alert('Select a saved ration from the dropdown first.');
        return;
      }
      const p = customPresets[parseInt(idx, 10)];
      if (confirm(`Remove "${p.name}" from saved presets?`)) {
        customPresets.splice(parseInt(idx, 10), 1);
        localStorage.setItem('calPresets', JSON.stringify(customPresets));
        renderPresets();
      }
    }

    function toggleApiDrawer() {
      const drawer = document.getElementById('apiDrawer');
      drawer.style.display = drawer.style.display === 'block' ? 'none' : 'block';
    }

    function saveApiKey() {
      const val = document.getElementById('usdaKeyInput').value.trim();
      usdaApiKey = val || 'DEMO_KEY';
      localStorage.setItem('usdaApiKey', usdaApiKey);
      document.getElementById('scanStatus').innerText = val ? 'Personal USDA API key saved locally.' : 'Reset to public DEMO_KEY.';
      document.getElementById('apiDrawer').style.display = 'none';
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnWeigh').classList.toggle('active', mode === 'weigh');
      document.getElementById('btnDirect').classList.toggle('active', mode === 'direct');
      document.getElementById('weighSection').classList.toggle('hidden', mode !== 'weigh');
      document.getElementById('directSection').classList.toggle('hidden', mode !== 'direct');
      if (mode !== 'weigh' && isScanning) {
        stopScanner();
      }
    }

    async function toggleScanner() {
      if (isScanning) {
        await stopScanner();
      } else {
        await startScanner();
      }
    }

    async function startScanner() {
      const statusEl = document.getElementById('scanStatus');
      const readerEl = document.getElementById('reader');

      if (typeof Html5Qrcode === 'undefined') {
        statusEl.innerText = 'Scanner library still loading—try again in a second.';
        return;
      }

      readerEl.style.display = 'block';
      statusEl.innerText = 'Starting camera...';

      try {
        html5QrCode = new Html5Qrcode('reader');
        await html5QrCode.start(
          { facingMode: 'environment' },
          { fps: 10, qrbox: { width: 250, height: 130 } },
          async (decodedText) => {
            await stopScanner();
            fetchProductData(decodedText);
          },
          () => {}
        );
        isScanning = true;
        setScanButtonActive();
        statusEl.innerText = 'Point camera at product barcode...';
      } catch (err) {
        readerEl.style.display = 'none';
        statusEl.innerText = 'Camera blocked or unavailable. Ensure HTTPS hosting & camera permission.';
      }
    }

    async function stopScanner() {
      const readerEl = document.getElementById('reader');
      if (html5QrCode && isScanning) {
        try {
          await html5QrCode.stop();
          html5QrCode.clear();
        } catch (e) {}
      }
      isScanning = false;
      readerEl.style.display = 'none';
      setScanButtonIdle();
    }

    function cleanBarcodeCandidates(raw) {
      const digits = raw.replace(/\D/g, '');
      const list = [digits];
      if (digits.length === 13 && digits.startsWith('0')) {
        list.push(digits.slice(1));
      } else if (digits.length === 12) {
        list.push('0' + digits);
      }
      return list;
    }

    async function queryUSDA(barcode) {
      const candidates = cleanBarcodeCandidates(barcode);
      for (const code of candidates) {
        const url = `https://api.nal.usda.gov/fdc/v1/foods/search?api_key=${encodeURIComponent(usdaApiKey)}&query=${encodeURIComponent(code)}&dataType=Branded&pageSize=5`;
        const resp = await fetch(url);
        if (!resp.ok) {
          if (resp.status === 429) throw new Error('USDA rate limit reached. Add a free personal API key.');
          if (resp.status === 403) throw new Error('Invalid USDA API key.');
          continue;
        }
        const data = await resp.json();
        if (data.foods && data.foods.length > 0) {
          const exact = data.foods.find(f => f.gtinUpc && cleanBarcodeCandidates(f.gtinUpc).includes(code)) || data.foods[0];
          const energy = (exact.foodNutrients || []).find(n =>
            n.nutrientNumber === '208' ||
            (n.nutrientName && n.nutrientName.toLowerCase().includes('energy') && n.unitName && n.unitName.toUpperCase() === 'KCAL')
          );
          if (energy && energy.value !== undefined) {
            const brand = exact.brandOwner || exact.brandName || '';
            const desc = exact.description || 'USDA Item';
            const titleCaseDesc = desc.toLowerCase().replace(/\w/g, c => c.toUpperCase());
            return {
              name: brand ? `${titleCaseDesc} (${brand})` : titleCaseDesc,
              kcal100g: Math.round(energy.value)
            };
          }
        }
      }
      return null;
    }

    async function fetchProductData(barcode) {
      const statusEl = document.getElementById('scanStatus');
      statusEl.innerText = `Checking USDA database for ${barcode}...`;

      try {
        const usdaHit = await queryUSDA(barcode);
        if (usdaHit) {
          document.getElementById('servingGrams').value = 100;
          document.getElementById('servingCals').value = usdaHit.kcal100g;
          document.getElementById('foodName').value = usdaHit.name;
          calculate();
          statusEl.innerText = `USDA Verified: ${usdaHit.name} (${usdaHit.kcal100g} kcal/100g)`;
          document.getElementById('foodGrams').focus();
          return;
        }

        statusEl.innerText = 'Not found in USDA database. Enter label manually & save preset.';
      } catch (err) {
        statusEl.innerText = err.message || 'Network error querying USDA database.';
      }
    }

    function calculate() {
      const sg = parseFloat(document.getElementById('servingGrams').value);
      const sc = parseFloat(document.getElementById('servingCals').value);
      const fg = parseFloat(document.getElementById('foodGrams').value);

      if (sg > 0 && sc >= 0 && fg >= 0) {
        const cals = Math.round((sc / sg) * fg);
        document.getElementById('result').innerText = cals;
        return cals;
      } else {
        document.getElementById('result').innerText = '0';
        return 0;
      }
    }

    function addToTally() {
      let cals = 0;
      let label = '';
      const nameInput = document.getElementById('foodName').value.trim();
      const meal = document.getElementById('mealCategory').value;

      if (currentMode === 'weigh') {
        cals = calculate();
        if (cals <= 0) return;
        const fg = document.getElementById('foodGrams').value;
        label = nameInput ? `${nameInput} (${fg}g)` : `Ration (${fg}g)`;
        document.getElementById('foodGrams').value = '';
        document.getElementById('result').innerText = '0';
      } else {
        cals = Math.round(parseFloat(document.getElementById('directCals').value));
        if (!(cals > 0)) return;
        label = nameInput ? nameInput : 'Direct Ration';
        document.getElementById('directCals').value = '';
      }

      logs.push({ label, cals, meal });
      document.getElementById('foodName').value = '';
      saveAndRender();
    }

    function removeItem(index) {
      logs.splice(index, 1);
      saveAndRender();
    }

    function clearTally() {
      if (logs.length === 0) return;
      if (confirm('Fire the cannon and reset all logged rations for today?')) {
        logs = [];
        saveAndRender();
      }
    }

    function saveGoal() {
      const val = parseFloat(document.getElementById('dailyGoal').value);
      dailyGoal = val > 0 ? Math.round(val) : 0;
      localStorage.setItem('calGoal', dailyGoal);
      updateProgress(getTotalCalories());
    }

    function getTotalCalories() {
      return logs.reduce((sum, item) => sum + item.cals, 0);
    }

    function updateProgress(total) {
      const progressArea = document.getElementById('goalProgressArea');
      if (dailyGoal > 0) {
        progressArea.classList.remove('hidden');
        const pct = Math.round((total / dailyGoal) * 100);
        const clampedPct = Math.min(pct, 100);
        const fill = document.getElementById('progressFill');
        fill.style.width = clampedPct + '%';

        document.getElementById('goalPercent').innerText = `${pct}% of allotment`;

        const diff = dailyGoal - total;
        const remEl = document.getElementById('goalRemaining');
        if (diff >= 0) {
          remEl.innerText = `${diff} kcal remaining`;
          remEl.style.color = 'var(--text-muted)';
          fill.classList.remove('over');
        } else {
          remEl.innerText = `${Math.abs(diff)} kcal over`;
          remEl.style.color = 'var(--danger)';
          fill.classList.add('over');
        }
      } else {
        progressArea.classList.add('hidden');
      }
    }

    function saveAndRender() {
      localStorage.setItem('calLogs', JSON.stringify(logs));
      const container = document.getElementById('mealContainer');
      container.innerHTML = '';
      let total = 0;

      MEALS.forEach(mealObj => {
        const section = document.createElement('div');
        section.className = 'meal-section';

        let mealTotal = 0;
        const ul = document.createElement('ul');

        logs.forEach((item, index) => {
          const itemMeal = item.meal || 'Snack';
          if (itemMeal === mealObj.key) {
            mealTotal += item.cals;
            total += item.cals;
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.label}</span><span><strong>${item.cals}</strong> kcal <span class="delete-item" onclick="removeItem(${index})" title="Remove entry"><svg class="icon" style="width:14px;height:14px;" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></span></span>`;
            ul.appendChild(li);
          }
        });

        const header = document.createElement('div');
        header.className = 'meal-header';
        header.innerHTML = `<span>${mealObj.label}</span><span>${mealTotal} kcal</span>`;
        section.appendChild(header);

        if (ul.children.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-msg';
          empty.innerText = 'No rations logged';
          section.appendChild(empty);
        } else {
          section.appendChild(ul);
        }

        container.appendChild(section);
      });

      document.getElementById('totalCals').innerText = total;
      updateProgress(total);
    }

    if (dailyGoal > 0) {
      document.getElementById('dailyGoal').value = dailyGoal;
    }
    if (usdaApiKey && usdaApiKey !== 'DEMO_KEY') {
      document.getElementById('usdaKeyInput').value = usdaApiKey;
    }
    setScanButtonIdle();
    applyTheme();
    renderPresets();
    saveAndRender();
  </script>
</body>
</html>
