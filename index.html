<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panem Ration Tracker</title>
  <style>
    :root {
      --bg-color: #12100e;
      --bg-gradient: radial-gradient(circle at top, #241b14 0%, #12100e 65%);
      --card-bg: #1c1916;
      --card-border: #382e23;
      --text-main: #f2ece1;
      --text-muted: #a89b88;
      --input-bg: #26221d;
      --input-border: #45392c;
      --box-bg: #171411;
      --divider: #2e261e;
      --accent: #d4af37;
      --accent-hover: #e5c158;
      --accent-text: #12100e;
      --ember: #c84b28;
      --danger: #e0523c;
      --btn-secondary-bg: #2b251f;
      --btn-secondary-text: #d6caba;
      --toggle-bg: #26221d;
      --toggle-active-bg: #d4af37;
      --toggle-active-text: #12100e;
      --progress-bg: #2b251f;
      --shadow: 0 6px 18px rgba(0, 0, 0, 0.45);
    }

    [data-theme="light"] {
      --bg-color: #f4f1ea;
      --bg-gradient: radial-gradient(circle at top, #ffffff 0%, #ebe5d8 100%);
      --card-bg: #ffffff;
      --card-border: #d6cbb8;
      --text-main: #241f1a;
      --text-muted: #6e6355;
      --input-bg: #faf8f5;
      --input-border: #cfc3b0;
      --box-bg: #f7f4ed;
      --divider: #e6dfd3;
      --accent: #b38728;
      --accent-hover: #99711d;
      --accent-text: #ffffff;
      --ember: #b83b1a;
      --danger: #c93b28;
      --btn-secondary-bg: #ebe4d5;
      --btn-secondary-text: #3d352c;
      --toggle-bg: #ebe4d5;
      --toggle-active-bg: #b38728;
      --toggle-active-text: #ffffff;
      --progress-bg: #e3dcd0;
      --shadow: 0 4px 14px rgba(45, 35, 20, 0.08);
    }

    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      max-width: 440px;
      margin: 0 auto;
      padding: 18px;
      min-height: 100vh;
      transition: background 0.25s ease, color 0.25s ease;
    }

    h1, h2, .serif-title {
      font-family: Georgia, 'Times New Roman', serif;
      letter-spacing: 0.5px;
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 12px;
    }

    .app-title-group {
      display: flex;
      flex-direction: column;
    }

    .app-title {
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--accent);
      margin: 0;
      text-transform: uppercase;
      letter-spacing: 1.2px;
    }

    .app-subtitle {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 2px;
    }

    .theme-btn {
      width: auto;
      padding: 7px 12px;
      font-size: 0.78rem;
      border-radius: 6px;
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--card-border);
      cursor: pointer;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .card {
      background: var(--card-bg);
      padding: 18px;
      border-radius: 10px;
      border: 1px solid var(--card-border);
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card-header {
      font-size: 1.05rem;
      font-weight: bold;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin: 0 0 12px 0;
    }

    .mode-toggle {
      display: flex;
      background: var(--toggle-bg);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 14px;
      border: 1px solid var(--card-border);
    }

    .mode-btn {
      flex: 1;
      padding: 9px;
      border: none;
      border-radius: 6px;
      background: transparent;
      color: var(--text-muted);
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .mode-btn.active {
      background: var(--toggle-active-bg);
      color: var(--toggle-active-text);
    }

    /* Scanner Box */
    .scanner-section {
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px dashed var(--divider);
    }

    .scanner-controls {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }

    .btn-scan {
      background: var(--btn-secondary-bg);
      color: var(--accent);
      border: 1px solid var(--accent);
      padding: 10px 12px;
      font-size: 0.85rem;
      border-radius: 7px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      cursor: pointer;
      width: 100%;
    }

    .btn-scan:hover {
      background: var(--accent);
      color: var(--accent-text);
    }

    .manual-barcode-row {
      display: flex;
      gap: 6px;
    }

    .manual-barcode-row input {
      margin-bottom: 0;
      padding: 9px 10px;
      font-size: 0.9rem;
    }

    .btn-lookup {
      width: auto;
      padding: 0 14px;
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--input-border);
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      cursor: pointer;
      white-space: nowrap;
    }

    #cameraContainer {
      display: none;
      margin-top: 10px;
      position: relative;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--accent);
      background: #000;
    }

    #scannerVideo {
      width: 100%;
      max-height: 220px;
      object-fit: cover;
      display: block;
    }

    .scan-aim-line {
      position: absolute;
      top: 50%;
      left: 10%;
      right: 10%;
      height: 2px;
      background: var(--ember);
      box-shadow: 0 0 8px var(--ember);
      pointer-events: none;
    }

    .btn-stop-scan {
      width: 100%;
      background: var(--ember);
      color: #fff;
      border: none;
      padding: 8px;
      font-size: 0.8rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }

    #scanStatus {
      font-size: 0.82rem;
      color: var(--accent);
      margin-top: 6px;
      min-height: 16px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px 12px;
      margin-bottom: 12px;
      border-radius: 7px;
      border: 1px solid var(--input-border);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .result-box {
      text-align: center;
      padding: 12px;
      background: var(--box-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .result-label {
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
    }

    .result-number {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2.1rem;
      font-weight: bold;
      color: var(--accent);
      margin-top: 2px;
    }

    button.primary-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 7px;
      font-size: 0.95rem;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
      background: var(--accent);
      color: var(--accent-text);
      transition: background 0.2s ease;
    }

    button.primary-btn:hover {
      background: var(--accent-hover);
    }

    .btn-clear {
      width: 100%;
      background: var(--btn-secondary-bg);
      color: var(--btn-secondary-text);
      border: 1px solid var(--card-border);
      margin-top: 14px;
      padding: 10px;
      border-radius: 7px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
    }

    .btn-clear:hover {
      border-color: var(--ember);
      color: var(--danger);
    }

    .target-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }

    .target-row label {
      margin: 0;
      white-space: nowrap;
    }

    .target-row input {
      width: 130px;
      margin: 0;
      padding: 8px 10px;
      text-align: right;
      font-weight: bold;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: var(--progress-bg);
      border-radius: 5px;
      overflow: hidden;
      margin-bottom: 8px;
      border: 1px solid var(--card-border);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--ember), var(--accent));
      transition: width 0.3s ease;
    }

    .progress-fill.over-limit {
      background: var(--danger);
    }

    .stats-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--divider);
    }

    .over-text {
      color: var(--danger);
      font-weight: bold;
    }

    .tally-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 10px;
    }

    .tally-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.1rem;
      font-weight: bold;
      text-transform: uppercase;
      color: var(--text-main);
    }

    .tally-total {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.35rem;
      font-weight: bold;
      color: var(--accent);
    }

    .meal-group {
      margin-top: 12px;
    }

    .meal-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      color: var(--accent);
      background: var(--box-bg);
      padding: 6px 10px;
      border-radius: 6px;
      border-left: 3px solid var(--accent);
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 6px;
      border-bottom: 1px solid var(--divider);
      font-size: 0.92rem;
    }

    .empty-meal {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-style: italic;
      padding: 6px 8px;
    }

    .delete-item {
      color: var(--danger);
      cursor: pointer;
      margin-left: 10px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="app-header">
    <div class="app-title-group">
      <h1 class="app-title">Panem Ration Tracker</h1>
      <div class="app-subtitle">District 12 Supply &amp; Calorie Ledger</div>
    </div>
    <button class="theme-btn" id="themeToggleBtn" onclick="toggleTheme()">Capitol Light</button>
  </div>

  <div class="card">
    <div class="mode-toggle">
      <button class="mode-btn active" id="btnWeighMode" onclick="setMode('weigh')">Weigh Rations</button>
      <button class="mode-btn" id="btnDirectMode" onclick="setMode('direct')">Direct Entry</button>
    </div>

    <!-- Weigh Food Mode -->
    <div id="weighSection">
      <div class="scanner-section">
        <div class="scanner-controls">
          <button type="button" class="btn-scan" onclick="startBarcodeScan()">Scan Supply Barcode</button>
        </div>
        <div class="manual-barcode-row">
          <input type="text" id="manualBarcodeInput" inputmode="numeric" placeholder="Or enter UPC / barcode digits...">
          <button type="button" class="btn-lookup" onclick="lookupManualBarcode()">Fetch</button>
        </div>
        <div id="cameraContainer">
          <video id="scannerVideo" playsinline autoplay muted></video>
          <div class="scan-aim-line"></div>
          <button type="button" class="btn-stop-scan" onclick="stopBarcodeScan()">Close Scanner</button>
        </div>
        <div id="scanStatus"></div>
      </div>

      <label for="servingGrams">Grams per serving (label)</label>
      <input type="number" id="servingGrams" inputmode="decimal" placeholder="e.g. 112" oninput="calculate()">

      <label for="servingCals">Calories per serving (label)</label>
      <input type="number" id="servingCals" inputmode="decimal" placeholder="e.g. 160" oninput="calculate()">

      <label for="foodGrams">Your ration weight (grams)</label>
      <input type="number" id="foodGrams" inputmode="decimal" placeholder="e.g. 168" oninput="calculate()">
    </div>

    <!-- Direct Calorie Mode -->
    <div id="directSection" class="hidden">
      <label for="directCals">Known ration calories (kcal)</label>
      <input type="number" id="directCals" inputmode="decimal" placeholder="e.g. 320" oninput="calculate()">
    </div>

    <div class="result-box">
      <div class="result-label">Calculated Ration Value</div>
      <div class="result-number"><span id="result">0</span> <span style="font-size: 1rem;">kcal</span></div>
    </div>

    <label for="mealCategory">Ration Period</label>
    <select id="mealCategory">
      <option value="Breakfast">Dawn Ration (Breakfast)</option>
      <option value="Lunch">Midday Ration (Lunch)</option>
      <option value="Dinner">Nightfall Ration (Dinner)</option>
      <option value="Snack">Sponsor Parachute (Snack)</option>
    </select>

    <label for="foodName">Ration Description (Optional)</label>
    <input type="text" id="foodName" placeholder="e.g. Tesserae Grain, Smoked Game">

    <button class="primary-btn" onclick="addToTally()">+ Log Ration to Ledger</button>
  </div>

  <div class="card">
    <div class="tally-header">
      <span class="tally-title">Daily Consumed</span>
      <span class="tally-total"><span id="totalCals">0</span> kcal</span>
    </div>

    <div class="target-row">
      <label for="dailyTarget">Daily Tribute Allotment:</label>
      <input type="number" id="dailyTarget" inputmode="numeric" placeholder="e.g. 2000" oninput="saveTarget()">
    </div>

    <div id="progressSection" class="hidden">
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <div class="stats-row">
        <span id="percentText">0% of allotment</span>
        <span id="remainingText">2000 kcal remaining</span>
      </div>
    </div>

    <div id="mealSections"></div>

    <button class="btn-clear" onclick="clearTally()">Cannon Reset (Clear Day)</button>
  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('calLogs')) || [];
    let dailyTarget = parseFloat(localStorage.getItem('calTarget')) || 0;
    let currentMode = 'weigh';
    let videoStream = null;
    let scanInterval = null;

    const MEAL_CONFIG = [
      { key: 'Breakfast', title: 'Dawn Ration (Breakfast)' },
      { key: 'Lunch', title: 'Midday Ration (Lunch)' },
      { key: 'Dinner', title: 'Nightfall Ration (Dinner)' },
      { key: 'Snack', title: 'Sponsor Parachute (Snack)' }
    ];

    // Initialize Theme
    const savedTheme = localStorage.getItem('calTheme') || 'dark';
    applyTheme(savedTheme);

    function applyTheme(theme) {
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('themeToggleBtn');
      btn.innerText = theme === 'dark' ? 'Capitol Light' : 'Arena Dark';
      localStorage.setItem('calTheme', theme);
    }

    function toggleTheme() {
      const current = document.documentElement.getAttribute('data-theme');
      applyTheme(current === 'dark' ? 'light' : 'dark');
    }

    if (dailyTarget > 0) {
      document.getElementById('dailyTarget').value = dailyTarget;
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnWeighMode').classList.toggle('active', mode === 'weigh');
      document.getElementById('btnDirectMode').classList.toggle('active', mode === 'direct');
      document.getElementById('weighSection').classList.toggle('hidden', mode !== 'weigh');
      document.getElementById('directSection').classList.toggle('hidden', mode !== 'direct');
      if (mode !== 'weigh') stopBarcodeScan();
      calculate();
    }

    // Barcode Scanner & Open Food Facts Lookup
    async function startBarcodeScan() {
      const statusEl = document.getElementById('scanStatus');
      const container = document.getElementById('cameraContainer');
      const video = document.getElementById('scannerVideo');

      if (!('BarcodeDetector' in window)) {
        statusEl.innerText = 'Live camera barcode detection is not supported in this browser. Type the barcode numbers below instead.';
        return;
      }

      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        statusEl.innerText = 'Camera access blocked (local file security). Enter the barcode digits manually below.';
        return;
      }

      try {
        statusEl.innerText = 'Activating Capitol optical scanner...';
        videoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = videoStream;
        container.style.display = 'block';
        statusEl.innerText = 'Align barcode with the red laser line...';

        const detector = new BarcodeDetector({
          formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128']
        });

        scanInterval = setInterval(async () => {
          if (video.readyState === video.HAVE_ENOUGH_DATA) {
            try {
              const barcodes = await detector.detect(video);
              if (barcodes.length > 0) {
                const code = barcodes[0].rawValue;
                stopBarcodeScan();
                document.getElementById('manualBarcodeInput').value = code;
                fetchProductByBarcode(code);
              }
            } catch (err) {
              // Ignore frame read errors while scanning
            }
          }
        }, 350);
      } catch (err) {
        statusEl.innerText = 'Camera permission denied or unavailable on local file. Type barcode digits below.';
        container.style.display = 'none';
      }
    }

    function stopBarcodeScan() {
      if (scanInterval) {
        clearInterval(scanInterval);
        scanInterval = null;
      }
      if (videoStream) {
        videoStream.getTracks().forEach(track => track.stop());
        videoStream = null;
      }
      document.getElementById('cameraContainer').style.display = 'none';
    }

    function lookupManualBarcode() {
      const code = document.getElementById('manualBarcodeInput').value.trim();
      if (!code) {
        document.getElementById('scanStatus').innerText = 'Please enter a barcode number first.';
        return;
      }
      fetchProductByBarcode(code);
    }

    async function fetchProductByBarcode(barcode) {
      const statusEl = document.getElementById('scanStatus');
      statusEl.innerText = `Querying Panem Supply Registry for ${barcode}...`;

      try {
        const response = await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json`);
        if (!response.ok) throw new Error('Network error');
        const data = await response.json();

        if (data.status === 1 && data.product) {
          const product = data.product;
          const nutriments = product.nutriments || {};
          const kcal100g = nutriments['energy-kcal_100g'] ?? nutriments['energy-kcal'];
          const productName = product.product_name || product.generic_name || 'Scanned Supply';

          if (kcal100g !== undefined && kcal100g !== null && !isNaN(kcal100g)) {
            document.getElementById('servingGrams').value = 100;
            document.getElementById('servingCals').value = Math.round(parseFloat(kcal100g) * 10) / 10;
            if (!document.getElementById('foodName').value.trim()) {
              document.getElementById('foodName').value = productName;
            }
            calculate();
            statusEl.innerText = `Found: ${productName} (${kcal100g} kcal per 100g). Enter your gram weight below.`;
          } else {
            statusEl.innerText = `Found "${productName}", but calorie-per-100g data is missing in registry.`;
          }
        } else {
          statusEl.innerText = `Barcode ${barcode} not found in registry. Enter label numbers manually.`;
        }
      } catch (err) {
        statusEl.innerText = 'Unable to reach database (check internet connection).';
      }
    }

    function calculate() {
      if (currentMode === 'weigh') {
        const sg = parseFloat(document.getElementById('servingGrams').value);
        const sc = parseFloat(document.getElementById('servingCals').value);
        const fg = parseFloat(document.getElementById('foodGrams').value);

        if (sg > 0 && sc >= 0 && fg >= 0) {
          const cals = Math.round((sc / sg) * fg);
          document.getElementById('result').innerText = cals;
          return cals;
        }
      } else {
        const dc = parseFloat(document.getElementById('directCals').value);
        if (dc > 0) {
          const cals = Math.round(dc);
          document.getElementById('result').innerText = cals;
          return cals;
        }
      }
      document.getElementById('result').innerText = '0';
      return 0;
    }

    function addToTally() {
      const cals = calculate();
      if (cals <= 0) return;

      const nameInput = document.getElementById('foodName').value.trim();
      const category = document.getElementById('mealCategory').value;
      let label = '';

      if (currentMode === 'weigh') {
        const fg = document.getElementById('foodGrams').value;
        label = nameInput ? `${nameInput} (${fg}g)` : `Weighed Ration (${fg}g)`;
        document.getElementById('foodGrams').value = '';
      } else {
        label = nameInput ? nameInput : 'Direct Ration Entry';
        document.getElementById('directCals').value = '';
      }

      logs.push({ label, cals, category });
      document.getElementById('foodName').value = '';
      document.getElementById('result').innerText = '0';
      saveAndRender();
    }

    function removeItem(index) {
      logs.splice(index, 1);
      saveAndRender();
    }

    function clearTally() {
      if (logs.length === 0) return;
      if (confirm('Sound the cannon and clear all logged rations for today? (Your daily allotment target will remain saved.)')) {
        logs = [];
        saveAndRender();
      }
    }

    function saveTarget() {
      const val = parseFloat(document.getElementById('dailyTarget').value);
      dailyTarget = val > 0 ? Math.round(val) : 0;
      localStorage.setItem('calTarget', dailyTarget);
      saveAndRender();
    }

    function updateProgress(total) {
      const section = document.getElementById('progressSection');
      if (dailyTarget <= 0) {
        section.classList.add('hidden');
        return;
      }

      section.classList.remove('hidden');
      const pct = Math.round((total / dailyTarget) * 100);
      const fill = document.getElementById('progressFill');
      fill.style.width = Math.min(pct, 100) + '%';

      const remaining = dailyTarget - total;
      const remainingEl = document.getElementById('remainingText');
      document.getElementById('percentText').innerText = `${pct}% of allotment`;

      if (remaining >= 0) {
        fill.classList.remove('over-limit');
        remainingEl.classList.remove('over-text');
        remainingEl.innerText = `${remaining} kcal remaining`;
      } else {
        fill.classList.add('over-limit');
        remainingEl.classList.add('over-text');
        remainingEl.innerText = `${Math.abs(remaining)} kcal over allotment`;
      }
    }

    function saveAndRender() {
      localStorage.setItem('calLogs', JSON.stringify(logs));
      const container = document.getElementById('mealSections');
      container.innerHTML = '';
      let grandTotal = 0;

      logs.forEach(item => { grandTotal += item.cals; });

      MEAL_CONFIG.forEach(meal => {
        const mealItems = logs
          .map((item, idx) => ({ ...item, originalIndex: idx, category: item.category || 'Snack' }))
          .filter(item => item.category === meal.key);

        const mealSubtotal = mealItems.reduce((sum, item) => sum + item.cals, 0);

        const groupDiv = document.createElement('div');
        groupDiv.className = 'meal-group';

        const headerDiv = document.createElement('div');
        headerDiv.className = 'meal-header';
        headerDiv.innerHTML = `<span>${meal.title}</span><span>${mealSubtotal} kcal</span>`;
        groupDiv.appendChild(headerDiv);

        if (mealItems.length === 0) {
          const emptyDiv = document.createElement('div');
          emptyDiv.className = 'empty-meal';
          emptyDiv.innerText = 'No rations logged';
          groupDiv.appendChild(emptyDiv);
        } else {
          const ul = document.createElement('ul');
          mealItems.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.label}</span><span><strong>${item.cals}</strong> kcal <span class="delete-item" onclick="removeItem(${item.originalIndex})">×</span></span>`;
            ul.appendChild(li);
          });
          groupDiv.appendChild(ul);
        }

        container.appendChild(groupDiv);
      });

      document.getElementById('totalCals').innerText = grandTotal;
      updateProgress(grandTotal);
    }

    saveAndRender();
  </script>
</body>
</html>
