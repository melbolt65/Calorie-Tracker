<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0088cc">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>Calorie Calculator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background-color: #121212;
      color: #f0f0f0;
      max-width: 420px;
      margin: 0 auto;
      padding: 20px;
    }
    h2 { margin-top: 0; font-size: 1.4rem; margin-bottom: 12px; }
    .card {
      background: #1e1e1e;
      padding: 16px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .mode-toggle {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
      background: #252525;
      padding: 4px;
      border-radius: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      background: transparent;
      color: #aaa;
      transition: background 0.2s, color 0.2s;
    }
    .mode-btn.active {
      background: #4caf50;
      color: #000;
    }
    label {
      display: block;
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 4px;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #2a2a2a;
      color: #fff;
      font-size: 1.05rem;
    }
    input:focus, select:focus { outline: none; border-color: #4caf50; }
    .result-box {
      text-align: center;
      padding: 12px;
      background: #252525;
      border-radius: 8px;
      margin-bottom: 12px;
    }
    .result-number {
      font-size: 2rem;
      font-weight: bold;
      color: #4caf50;
    }
    button.action-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }
    .btn-add { background: #4caf50; color: #000; }
    .btn-clear { background: #333; color: #ddd; margin-top: 14px; padding: 10px; font-size: 0.9rem; }
    .btn-clear:hover { background: #444; }
    .tally-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      margin-bottom: 12px;
    }
    .goal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }
    .goal-row label {
      margin: 0;
      white-space: nowrap;
    }
    .goal-row input {
      margin: 0;
      padding: 8px 10px;
      width: 120px;
      text-align: right;
      font-size: 1rem;
    }
    .progress-container {
      margin-bottom: 14px;
      background: #252525;
      padding: 12px;
      border-radius: 8px;
    }
    .progress-bar-bg {
      width: 100%;
      height: 12px;
      background: #333;
      border-radius: 6px;
      overflow: hidden;
      margin-bottom: 8px;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #4caf50;
      transition: width 0.3s ease, background-color 0.3s ease;
    }
    .progress-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: #ccc;
    }
    .category-section {
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid #2c2c2c;
    }
    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: bold;
      font-size: 0.95rem;
      color: #4caf50;
      margin-bottom: 6px;
    }
    .category-subtotal {
      color: #aaa;
      font-size: 0.9rem;
    }
    ul { list-style: none; padding: 0; margin: 0; }
    li {
      display: flex;
      justify-content: space-between;
      padding: 6px 0;
      font-size: 0.92rem;
      color: #e0e0e0;
    }
    .empty-cat {
      font-size: 0.85rem;
      color: #666;
      font-style: italic;
      padding: 4px 0;
    }
    .delete-item { color: #ff5252; cursor: pointer; margin-left: 10px; font-weight: bold; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Quick Calorie Log</h2>

    <div class="mode-toggle">
      <button type="button" id="btnWeigh" class="mode-btn active" onclick="setMode('weigh')">Weigh Food</button>
      <button type="button" id="btnDirect" class="mode-btn" onclick="setMode('direct')">Direct Calories</button>
    </div>

    <div id="weighSection">
      <label for="servingGrams">Grams per serving (label)</label>
      <input type="number" id="servingGrams" inputmode="decimal" placeholder="e.g. 112" oninput="calculate()">

      <label for="servingCals">Calories per serving (label)</label>
      <input type="number" id="servingCals" inputmode="decimal" placeholder="e.g. 160" oninput="calculate()">

      <label for="foodGrams">Your food weight (grams)</label>
      <input type="number" id="foodGrams" inputmode="decimal" placeholder="e.g. 168" oninput="calculate()">

      <div class="result-box">
        <div style="font-size: 0.85rem; color: #aaa;">Calculated Calories</div>
        <div class="result-number" id="result">0</div>
      </div>
    </div>

    <div id="directSection" class="hidden">
      <label for="directCals">Calories</label>
      <input type="number" id="directCals" inputmode="decimal" placeholder="e.g. 250">
    </div>

    <label for="mealCategory">Meal Category</label>
    <select id="mealCategory">
      <option value="Breakfast">Breakfast</option>
      <option value="Lunch">Lunch</option>
      <option value="Dinner">Dinner</option>
      <option value="Snack">Snack</option>
    </select>

    <label for="foodName">Food label (optional)</label>
    <input type="text" id="foodName" placeholder="e.g. Chicken, Coffee, Apple">
    <button type="button" class="action-btn btn-add" onclick="addToTally()">+ Add to Daily Tally</button>
  </div>

  <div class="card">
    <div class="tally-header">
      <span>Daily Total:</span>
      <span style="color: #4caf50;"><span id="totalCals">0</span> kcal</span>
    </div>

    <div class="goal-row">
      <label for="dailyGoal">Daily Target (kcal):</label>
      <input type="number" id="dailyGoal" inputmode="numeric" placeholder="e.g. 1800" oninput="updateGoal()">
    </div>

    <div id="progressSection" class="progress-container hidden">
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <div class="progress-stats">
        <span id="percentText">0% of goal</span>
        <span id="remainingText">0 kcal remaining</span>
      </div>
    </div>

    <div id="categoriesContainer"></div>

    <button type="button" class="action-btn btn-clear" onclick="clearTally()">Reset Daily Tally</button>
  </div>

  <script>
    let currentMode = 'weigh';
    const categories = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
    let logs = JSON.parse(localStorage.getItem('calLogs')) || [];
    let dailyGoal = parseFloat(localStorage.getItem('dailyGoal')) || 0;

    if (dailyGoal > 0) {
      document.getElementById('dailyGoal').value = dailyGoal;
    }

    function setMode(mode) {
      currentMode = mode;
      const weighSec = document.getElementById('weighSection');
      const directSec = document.getElementById('directSection');
      const btnWeigh = document.getElementById('btnWeigh');
      const btnDirect = document.getElementById('btnDirect');

      if (mode === 'weigh') {
        weighSec.classList.remove('hidden');
        directSec.classList.add('hidden');
        btnWeigh.classList.add('active');
        btnDirect.classList.remove('active');
      } else {
        weighSec.classList.add('hidden');
        directSec.classList.remove('hidden');
        btnWeigh.classList.remove('active');
        btnDirect.classList.add('active');
      }
    }

    function calculate() {
      const sg = parseFloat(document.getElementById('servingGrams').value);
      const sc = parseFloat(document.getElementById('servingCals').value);
      const fg = parseFloat(document.getElementById('foodGrams').value);

      if (sg > 0 && sc >= 0 && fg >= 0) {
        const cals = Math.round((sc / sg) * fg);
        document.getElementById('result').innerText = cals;
        return cals;
      } else {
        document.getElementById('result').innerText = '0';
        return 0;
      }
    }

    function updateGoal() {
      const val = parseFloat(document.getElementById('dailyGoal').value);
      dailyGoal = val > 0 ? val : 0;
      localStorage.setItem('dailyGoal', dailyGoal);
      renderProgress(getTotalCals());
    }

    function getTotalCals() {
      return logs.reduce((sum, item) => sum + item.cals, 0);
    }

    function renderProgress(total) {
      const progSec = document.getElementById('progressSection');
      if (dailyGoal <= 0) {
        progSec.classList.add('hidden');
        return;
      }
      progSec.classList.remove('hidden');

      const rawPct = (total / dailyGoal) * 100;
      const displayPct = Math.round(rawPct);
      const barWidth = Math.min(rawPct, 100);
      const diff = dailyGoal - total;

      const fill = document.getElementById('progressFill');
      fill.style.width = barWidth + '%';

      const remText = document.getElementById('remainingText');
      if (diff >= 0) {
        fill.style.backgroundColor = '#4caf50';
        remText.innerText = `${diff} kcal remaining`;
        remText.style.color = '#ccc';
      } else {
        fill.style.backgroundColor = '#ff5252';
        remText.innerText = `${Math.abs(diff)} kcal over`;
        remText.style.color = '#ff5252';
      }

      document.getElementById('percentText').innerText = `${displayPct}% of target`;
    }

    function addToTally() {
      let cals = 0;
      let label = '';
      const nameInput = document.getElementById('foodName').value.trim();
      const category = document.getElementById('mealCategory').value;

      if (currentMode === 'weigh') {
        cals = calculate();
        if (cals <= 0) return;
        const fg = document.getElementById('foodGrams').value;
        label = nameInput ? `${nameInput} (${fg}g)` : `Weighed Food (${fg}g)`;
        document.getElementById('foodGrams').value = '';
        document.getElementById('result').innerText = '0';
      } else {
        cals = Math.round(parseFloat(document.getElementById('directCals').value));
        if (!cals || cals <= 0) return;
        label = nameInput ? nameInput : 'Quick Entry';
        document.getElementById('directCals').value = '';
      }

      logs.push({ label, cals, category });
      document.getElementById('foodName').value = '';
      saveAndRender();
    }

    function removeItem(index) {
      logs.splice(index, 1);
      saveAndRender();
    }

    function clearTally() {
      if (logs.length === 0) return;
      if (confirm('Are you sure you want to reset your daily tally? This will clear all logged meals for today.')) {
        logs = [];
        saveAndRender();
      }
    }

    function saveAndRender() {
      localStorage.setItem('calLogs', JSON.stringify(logs));
      const container = document.getElementById('categoriesContainer');
      container.innerHTML = '';
      let total = 0;

      categories.forEach(cat => {
        const catItems = logs
          .map((item, idx) => ({ ...item, originalIndex: idx, category: item.category || 'Snack' }))
          .filter(item => item.category === cat);

        const catTotal = catItems.reduce((sum, item) => sum + item.cals, 0);
        total += catTotal;

        const section = document.createElement('div');
        section.className = 'category-section';

        const header = document.createElement('div');
        header.className = 'category-header';
        header.innerHTML = `<span>${cat}</span><span class="category-subtotal">${catTotal} kcal</span>`;
        section.appendChild(header);

        if (catItems.length === 0) {
          const empty = document.createElement('div');
          empty.className = 'empty-cat';
          empty.innerText = 'No items logged';
          section.appendChild(empty);
        } else {
          const ul = document.createElement('ul');
          catItems.forEach(item => {
            const li = document.createElement('li');
            li.innerHTML = `<span>${item.label}</span><span><strong>${item.cals}</strong> kcal <span class="delete-item" onclick="removeItem(${item.originalIndex})">×</span></span>`;
            ul.appendChild(li);
          });
          section.appendChild(ul);
        }

        container.appendChild(section);
      });

      document.getElementById('totalCals').innerText = total;
      renderProgress(total);
    }

    saveAndRender();
  </script>
</body>
</html>
