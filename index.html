<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panem Ration Tracker</title>
  <style>
    :root {
      --bg-color: #0d0c0b;
      --card-bg: #171513;
      --border-color: #382f22;
      --text-primary: #ece6d8;
      --text-secondary: #9c9282;
      --input-bg: #221f1c;
      --accent-color: #d4af37;
      --accent-hover: #f0c94b;
      --accent-text: #0d0c0b;
      --ember-color: #e05a2b;
      --danger-color: #b8292f;
      --btn-sec-bg: #2a2520;
      --btn-sec-text: #d6cec0;
      --card-shadow: 0 4px 16px rgba(0, 0, 0, 0.5);
    }

    body.light-theme {
      --bg-color: #f4f1ea;
      --card-bg: #ffffff;
      --border-color: #d6cbb8;
      --text-primary: #1f1b16;
      --text-secondary: #6b6154;
      --input-bg: #f9f7f2;
      --accent-color: #b8860b;
      --accent-hover: #996e06;
      --accent-text: #ffffff;
      --ember-color: #c84b1f;
      --danger-color: #a81c22;
      --btn-sec-bg: #e8e2d5;
      --btn-sec-text: #2e2821;
      --card-shadow: 0 2px 10px rgba(31, 27, 22, 0.08);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      max-width: 440px;
      margin: 0 auto;
      padding: 18px;
      transition: background-color 0.2s, color 0.2s;
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }

    .title-group h1 {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.35rem;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin: 0;
      color: var(--accent-color);
    }

    .subtitle {
      font-size: 0.72rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--text-secondary);
      margin-top: 2px;
    }

    .theme-toggle {
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 1px solid var(--border-color);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
      width: auto;
    }

    .card {
      background: var(--card-bg);
      padding: 16px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      box-shadow: var(--card-shadow);
      margin-bottom: 16px;
    }

    .mode-switch {
      display: flex;
      gap: 8px;
      margin-bottom: 14px;
      background: var(--input-bg);
      padding: 4px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .mode-btn {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      cursor: pointer;
      background: transparent;
      color: var(--text-secondary);
      transition: all 0.15s;
    }

    .mode-btn.active {
      background: var(--accent-color);
      color: var(--accent-text);
    }

    label {
      display: block;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.7px;
      color: var(--text-secondary);
      margin-bottom: 4px;
      font-weight: 600;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 11px;
      margin-bottom: 12px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-primary);
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    .result-box {
      text-align: center;
      padding: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .result-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-secondary);
    }

    .result-number {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 2rem;
      font-weight: bold;
      color: var(--accent-color);
      margin-top: 2px;
    }

    button.primary-btn {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 6px;
      font-size: 0.92rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent-color), var(--ember-color));
      color: #ffffff;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
    }

    button.primary-btn:hover {
      opacity: 0.95;
    }

    .tally-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
      margin-bottom: 12px;
    }

    .tally-title {
      font-family: Georgia, 'Times New Roman', serif;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: bold;
    }

    .tally-total {
      font-size: 1.25rem;
      font-weight: bold;
      color: var(--accent-color);
    }

    .goal-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .goal-row label {
      margin: 0;
      white-space: nowrap;
    }

    .goal-row input {
      margin: 0;
      max-width: 120px;
      padding: 7px 10px;
      text-align: right;
      font-weight: bold;
    }

    .progress-container {
      width: 100%;
      height: 10px;
      background: var(--input-bg);
      border-radius: 5px;
      overflow: hidden;
      border: 1px solid var(--border-color);
      margin-bottom: 6px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-color), var(--ember-color));
      transition: width 0.25s ease;
    }

    .progress-bar.over-limit {
      background: var(--danger-color);
    }

    .goal-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      color: var(--text-secondary);
      margin-bottom: 14px;
      font-weight: 600;
    }

    .over-text {
      color: var(--danger-color);
    }

    .category-section {
      margin-bottom: 12px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
    }

    .category-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--accent-color);
      margin-bottom: 6px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 0;
      border-top: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    li:first-child {
      border-top: none;
    }

    .empty-cat {
      font-size: 0.8rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    .delete-item {
      color: var(--danger-color);
      cursor: pointer;
      margin-left: 10px;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .btn-clear {
      width: 100%;
      background: var(--btn-sec-bg);
      color: var(--btn-sec-text);
      border: 1px solid var(--border-color);
      margin-top: 6px;
      padding: 10px;
      border-radius: 6px;
      font-size: 0.82rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-group">
      <h1>🔥 Panem Rations</h1>
      <div class="subtitle">Arena Calorie &amp; Tribute Supply Log</div>
    </div>
    <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()">Capitol Light</button>
  </div>

  <div class="card">
    <div class="mode-switch">
      <button class="mode-btn active" id="btnWeigh" onclick="setMode('weigh')">Weigh Rations</button>
      <button class="mode-btn" id="btnDirect" onclick="setMode('direct')">Direct Supply</button>
    </div>

    <div id="weighInputs">
      <label for="servingGrams">Grams per serving (label)</label>
      <input type="number" id="servingGrams" inputmode="decimal" placeholder="e.g. 112" oninput="calculate()">

      <label for="servingCals">Calories per serving (label)</label>
      <input type="number" id="servingCals" inputmode="decimal" placeholder="e.g. 160" oninput="calculate()">

      <label for="foodGrams">Ration weight (grams)</label>
      <input type="number" id="foodGrams" inputmode="decimal" placeholder="e.g. 168" oninput="calculate()">
    </div>

    <div id="directInputs" class="hidden">
      <label for="directCals">Total Ration Calories</label>
      <input type="number" id="directCals" inputmode="decimal" placeholder="e.g. 350" oninput="calculate()">
    </div>

    <div class="result-box">
      <div class="result-label">Calculated Ration Yield</div>
      <div class="result-number"><span id="result">0</span> <span style="font-size: 1rem;">kcal</span></div>
    </div>

    <label for="mealCategory">Arena Shift / Meal</label>
    <select id="mealCategory">
      <option value="Breakfast">Dawn Ration (Breakfast)</option>
      <option value="Lunch">Midday Ration (Lunch)</option>
      <option value="Dinner">Nightfall Ration (Dinner)</option>
      <option value="Snack">Sponsor Parachute (Snack)</option>
    </select>

    <label for="foodName">Ration Description (Optional)</label>
    <input type="text" id="foodName" placeholder="e.g. District 12 Bread, Roasted Groosling">

    <button class="primary-btn" onclick="addToTally()">+ Claim Ration</button>
  </div>

  <div class="card">
    <div class="tally-header">
      <span class="tally-title">Daily Tribute Allotment</span>
      <span class="tally-total"><span id="totalCals">0</span> kcal</span>
    </div>

    <div class="goal-row">
      <label for="dailyGoal">Daily Allowance (kcal):</label>
      <input type="number" id="dailyGoal" inputmode="decimal" placeholder="e.g. 1950" oninput="saveGoal()">
    </div>

    <div id="goalProgressWrapper" class="hidden">
      <div class="progress-container">
        <div class="progress-bar" id="progressBar"></div>
      </div>
      <div class="goal-stats">
        <span id="percentText">0% of allowance</span>
        <span id="remainingText">0 kcal remaining</span>
      </div>
    </div>

    <div class="category-section">
      <div class="category-header">
        <span>🌅 Dawn Ration (Breakfast)</span>
        <span><span id="sub-Breakfast">0</span> kcal</span>
      </div>
      <ul id="list-Breakfast"></ul>
    </div>

    <div class="category-section">
      <div class="category-header">
        <span>☀️ Midday Ration (Lunch)</span>
        <span><span id="sub-Lunch">0</span> kcal</span>
      </div>
      <ul id="list-Lunch"></ul>
    </div>

    <div class="category-section">
      <div class="category-header">
        <span>🌙 Nightfall Ration (Dinner)</span>
        <span><span id="sub-Dinner">0</span> kcal</span>
      </div>
      <ul id="list-Dinner"></ul>
    </div>

    <div class="category-section">
      <div class="category-header">
        <span>🪂 Sponsor Parachute (Snack)</span>
        <span><span id="sub-Snack">0</span> kcal</span>
      </div>
      <ul id="list-Snack"></ul>
    </div>

    <button class="btn-clear" onclick="clearTally()">Cannon Reset (Clear Day)</button>
  </div>

  <script>
    let logs = JSON.parse(localStorage.getItem('calLogs')) || [];
    let dailyGoal = parseFloat(localStorage.getItem('calGoal')) || 0;
    let currentMode = 'weigh';

    const savedTheme = localStorage.getItem('calTheme');
    if (savedTheme === 'light') {
      document.body.classList.add('light-theme');
      document.getElementById('themeBtn').innerText = 'Arena Dark';
    }

    if (dailyGoal > 0) {
      document.getElementById('dailyGoal').value = dailyGoal;
    }

    function toggleTheme() {
      const isLight = document.body.classList.toggle('light-theme');
      localStorage.setItem('calTheme', isLight ? 'light' : 'dark');
      document.getElementById('themeBtn').innerText = isLight ? 'Arena Dark' : 'Capitol Light';
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnWeigh').classList.toggle('active', mode === 'weigh');
      document.getElementById('btnDirect').classList.toggle('active', mode === 'direct');
      document.getElementById('weighInputs').classList.toggle('hidden', mode !== 'weigh');
      document.getElementById('directInputs').classList.toggle('hidden', mode !== 'direct');
      calculate();
    }

    function calculate() {
      if (currentMode === 'weigh') {
        const sg = parseFloat(document.getElementById('servingGrams').value);
        const sc = parseFloat(document.getElementById('servingCals').value);
        const fg = parseFloat(document.getElementById('foodGrams').value);

        if (sg > 0 && sc >= 0 && fg >= 0) {
          const cals = Math.round((sc / sg) * fg);
          document.getElementById('result').innerText = cals;
          return cals;
        }
      } else {
        const dc = parseFloat(document.getElementById('directCals').value);
        if (dc >= 0) {
          const cals = Math.round(dc);
          document.getElementById('result').innerText = cals;
          return cals;
        }
      }
      document.getElementById('result').innerText = '0';
      return 0;
    }

    function addToTally() {
      const cals = calculate();
      if (cals <= 0) return;

      const nameInput = document.getElementById('foodName').value.trim();
      const category = document.getElementById('mealCategory').value;
      let label = '';

      if (currentMode === 'weigh') {
        const fg = document.getElementById('foodGrams').value;
        label = nameInput ? `${nameInput} (${fg}g)` : `Ration (${fg}g)`;
        document.getElementById('foodGrams').value = '';
      } else {
        label = nameInput ? nameInput : 'Direct Supply';
        document.getElementById('directCals').value = '';
      }

      logs.push({ label, cals, category });
      document.getElementById('foodName').value = '';
      document.getElementById('result').innerText = '0';
      saveAndRender();
    }

    function removeItem(index) {
      logs.splice(index, 1);
      saveAndRender();
    }

    function clearTally() {
      if (logs.length === 0) return;
      if (confirm('Sound the cannon and wipe all logged rations for today?')) {
        logs = [];
        saveAndRender();
      }
    }

    function saveGoal() {
      const val = parseFloat(document.getElementById('dailyGoal').value);
      dailyGoal = val > 0 ? val : 0;
      localStorage.setItem('calGoal', dailyGoal);
      updateGoalUI();
    }

    function updateGoalUI() {
      const total = logs.reduce((sum, item) => sum + item.cals, 0);
      const wrapper = document.getElementById('goalProgressWrapper');
      const bar = document.getElementById('progressBar');
      const percentText = document.getElementById('percentText');
      const remainingText = document.getElementById('remainingText');

      if (dailyGoal > 0) {
        wrapper.classList.remove('hidden');
        const pct = Math.round((total / dailyGoal) * 100);
        const clampedPct = Math.min(pct, 100);
        bar.style.width = clampedPct + '%';

        percentText.innerText = `${pct}% of allowance`;
        const diff = dailyGoal - total;

        if (diff >= 0) {
          bar.classList.remove('over-limit');
          remainingText.classList.remove('over-text');
          remainingText.innerText = `${diff} kcal remaining`;
        } else {
          bar.classList.add('over-limit');
          remainingText.classList.add('over-text');
          remainingText.innerText = `${Math.abs(diff)} kcal over allowance`;
        }
      } else {
        wrapper.classList.add('hidden');
      }
    }

    function saveAndRender() {
      localStorage.setItem('calLogs', JSON.stringify(logs));
      const categories = ['Breakfast', 'Lunch', 'Dinner', 'Snack'];
      const subtotals = { Breakfast: 0, Lunch: 0, Dinner: 0, Snack: 0 };

      categories.forEach(cat => {
        document.getElementById(`list-${cat}`).innerHTML = '';
      });

      let total = 0;

      logs.forEach((item, index) => {
        const cat = categories.includes(item.category) ? item.category : 'Snack';
        total += item.cals;
        subtotals[cat] += item.cals;

        const li = document.createElement('li');
        li.innerHTML = `<span>${item.label}</span><span><strong>${item.cals}</strong> kcal <span class="delete-item" onclick="removeItem(${index})">×</span></span>`;
        document.getElementById(`list-${cat}`).appendChild(li);
      });

      categories.forEach(cat => {
        document.getElementById(`sub-${cat}`).innerText = subtotals[cat];
        const listEl = document.getElementById(`list-${cat}`);
        if (listEl.children.length === 0) {
          listEl.innerHTML = '<li class="empty-cat">No rations logged</li>';
        }
      });

      document.getElementById('totalCals').innerText = total;
      updateGoalUI();
    }

    saveAndRender();
  </script>
</body>
</html>
